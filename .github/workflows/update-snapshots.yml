name: Update visual baselines

# Run manually after an intended UI change (or once after creating the repo)
# to regenerate the linux screenshots inside the Playwright Docker image and
# commit them back to the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test --project=visual --update-snapshots
      - name: Commit new baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__/linux
          git diff --cached --quiet && echo "Baselines unchanged" && exit 0
          git commit -m "test(visual): update linux baselines"
          git push
